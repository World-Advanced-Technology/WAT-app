---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wat-website
  namespace: production
  labels:
    app: wat-website
    version: "1.0"
    company: world-advanced-technology
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wat-website
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: wat-website
        version: "1.0"
    spec:
      containers:
        - name: wat-website
          image: your-dockerhub-username/wat-website:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: NGINX_ENVSUBST_TEMPLATE_SUFFIX
              value: ".template"
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: wat-website-service
  namespace: production
  labels:
    app: wat-website
spec:
  type: LoadBalancer
  selector:
    app: wat-website
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wat-website-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - worldadvancedtechnology.cm
        - www.worldadvancedtechnology.cm
      secretName: wat-website-tls
  rules:
    - host: worldadvancedtechnology.cm
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wat-website-service
                port:
                  number: 80
    - host: www.worldadvancedtechnology.cm
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wat-website-service
                port:
                  number: 80
